<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accesso Admin | Linea Chiara Infissi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: var(--bg-light);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .login-card {
            background: white;
            padding: 2rem;
            border-radius: 0;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            border-top: 5px solid var(--primary-color);
        }

        .login-card h2 {
            margin-bottom: 1.5rem;
            color: var(--primary-color);
            text-align: center;
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.2rem rgba(0, 91, 113, 0.25);
        }
    </style>
</head>

<body>

    <div class="login-card">
        <h2><i class="fas fa-user-shield me-2"></i> Accesso Admin</h2>
        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label small fw-bold text-uppercase">Nome Utente</label>
                <input type="text" id="username" class="form-control" required>
            </div>
            <div class="mb-4">
                <label class="form-label small fw-bold text-uppercase">Password</label>
                <input type="password" id="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 rounded-0 text-uppercase fw-bold">Accedi</button>
            <div id="errorMsg" class="text-danger mt-3 small text-center d-none">
                Credenziali non valide. Riprova.
            </div>
        </form>
        <div class="text-center mt-4">
            <a href="index.html" class="text-muted small text-decoration-none"><i class="fas fa-arrow-left me-1"></i>
                Torna al sito</a>
        </div>
    </div>

    <script>
        // Secure hashing function using Web Crypto API
        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // Initialize admin credentials securely on first load
        async function initAuth() {
            if (!localStorage.getItem('admin_user')) {
                localStorage.setItem('admin_user', 'admin');
                // Default password '12345678' hashed
                localStorage.setItem('admin_pass', 'ef797c8118f02dfb649607dd5d3f8c7623048c9c063d532cc95c5ed7a898a64f');
            }
        }
        initAuth();

        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');

            const hashedInput = await sha256(pass);
            const storedUser = localStorage.getItem('admin_user');
            const storedPass = localStorage.getItem('admin_pass');

            if (user === storedUser && hashedInput === storedPass) {
                // Store a session token derived from credentials to prevent easy bypass
                const sessionToken = await sha256(user + storedPass + "lineachiarasalt");
                localStorage.setItem('isLoggedIn', sessionToken);
                window.location.href = 'admin.html';
            } else {
                errorMsg.classList.remove('d-none');
            }
        });
    </script>
</body>

</html>
